# C++ keywords -- the part of the lexicon no header scan can produce.
# Hand-written: summary, intent (embedded), and semantic keys.
# `keys.canonical` must be globally unique; lint.py enforces it.

- uid: cpp:lang.kw.alignas
  kind: keyword
  name: alignas
  domain: language
  std_since: C++11
  summary: Force a type or object to a stricter memory alignment.
  intent: >-
    Control where in memory something is placed. Used for cache-line padding to
    avoid false sharing between threads, for SIMD types that require 16 or 32
    byte alignment, and for hardware structures with fixed layout requirements.
  tags: [memory, layout, performance, low-level]
  keys:
    canonical: language.memory.align-to
    colloquial: [force-memory-alignment, pad-to-a-cache-line, align-for-simd]
    question: [how-do-i.control-memory-alignment]
    problem: [false-sharing-between-threads, unaligned-simd-load-crashes]
    symbolic: [alignas]

- uid: cpp:lang.kw.alignof
  kind: keyword
  name: alignof
  domain: language
  std_since: C++11
  summary: Query the required alignment of a type, in bytes.
  intent: Find out what byte boundary a type must sit on. Companion to sizeof.
  tags: [memory, layout, introspection]
  keys:
    canonical: language.memory.alignment-of
    colloquial: [what-alignment-does-this-type-need, get-type-alignment]
    question: [how-do-i.find-a-types-alignment]
    symbolic: [alignof]

- uid: cpp:lang.kw.asm
  kind: keyword
  name: asm
  domain: language
  std_since: C++98
  summary: Embed assembly instructions directly in a function.
  intent: >-
    Drop to raw machine instructions when no C++ construct expresses what the
    hardware must do -- special registers, atomic primitives, timing barriers.
    Non-portable by nature.
  tags: [low-level, non-portable, hardware]
  keys:
    canonical: language.hardware.inline-assembly
    colloquial: [write-raw-assembly, drop-to-machine-code]
    question: [how-do-i.embed-assembly-in-c-plus-plus]
    symbolic: [asm, __asm__]

- uid: cpp:lang.kw.auto
  kind: keyword
  name: auto
  domain: language
  std_since: C++11
  summary: Let the compiler deduce a variable's type from its initialiser.
  intent: >-
    Stop writing out long iterator and lambda type names. Also used for return
    type deduction on functions and, since C++20, as an abbreviated function
    template parameter.
  tags: [types, deduction, readability]
  keys:
    canonical: language.type.deduce
    colloquial: [let-the-compiler-figure-out-the-type, dont-write-the-type-out,
                 infer-the-variable-type]
    question: [how-do-i.avoid-writing-long-type-names]
    problem: [this-iterator-type-name-is-unreadable]
    symbolic: [auto]

- uid: cpp:lang.kw.bool
  kind: keyword
  name: bool
  domain: language
  std_since: C++98
  summary: The built-in boolean type, holding true or false.
  intent: Represent a yes/no condition.
  tags: [types, fundamental]
  keys:
    canonical: language.type.boolean
    colloquial: [true-or-false-value, yes-no-flag]
    symbolic: [bool]

- uid: cpp:lang.kw.break
  kind: keyword
  name: break
  domain: language
  std_since: C++98
  summary: Leave the innermost enclosing loop or switch immediately.
  intent: Stop looping early once the answer is found, or end a switch case.
  tags: [control-flow, loops]
  keys:
    canonical: language.control.exit-loop
    colloquial: [stop-the-loop-early, get-out-of-this-loop, end-a-switch-case]
    question: [how-do-i.exit-a-loop-early]
    problem: [my-loop-keeps-running-after-i-found-what-i-wanted]
    symbolic: [break]

- uid: cpp:lang.kw.case
  kind: keyword
  name: case
  domain: language
  std_since: C++98
  summary: Label one branch of a switch statement.
  intent: Name the constant value that selects this branch of a switch.
  tags: [control-flow, branching]
  keys:
    canonical: language.control.switch-branch
    colloquial: [one-branch-of-a-switch, handle-this-specific-value]
    symbolic: [case]

- uid: cpp:lang.kw.catch
  kind: keyword
  name: catch
  domain: language
  std_since: C++98
  summary: Handle an exception thrown inside the preceding try block.
  intent: >-
    Recover from a failure signalled by throw. Catch by const reference to avoid
    slicing; catch(...) catches everything.
  tags: [error-handling, exceptions]
  keys:
    canonical: language.error.handle-exception
    colloquial: [handle-an-error, deal-with-a-thrown-exception, recover-from-a-failure]
    question: [how-do-i.catch-an-exception]
    problem: [my-program-crashes-on-an-uncaught-exception]
    symbolic: [catch]

- uid: cpp:lang.kw.char
  kind: keyword
  name: char
  domain: language
  std_since: C++98
  summary: The narrow character type, one byte wide.
  intent: Hold a single byte or character. Signedness is implementation defined.
  tags: [types, fundamental, text]
  keys:
    canonical: language.type.character
    colloquial: [a-single-character, one-byte-value]
    symbolic: [char]

- uid: cpp:lang.kw.char8_t
  kind: keyword
  name: char8_t
  domain: language
  std_since: C++20
  summary: A distinct type for one UTF-8 code unit.
  intent: Type-safe UTF-8 text, distinguishable from plain bytes.
  tags: [types, text, unicode]
  keys:
    canonical: language.type.utf8-code-unit
    colloquial: [utf8-character-type, unicode-byte]
    symbolic: [char8_t]

- uid: cpp:lang.kw.char16_t
  kind: keyword
  name: char16_t
  domain: language
  std_since: C++11
  summary: A distinct type for one UTF-16 code unit.
  intent: Type-safe UTF-16 text.
  tags: [types, text, unicode]
  keys:
    canonical: language.type.utf16-code-unit
    colloquial: [utf16-character-type]
    symbolic: [char16_t]

- uid: cpp:lang.kw.char32_t
  kind: keyword
  name: char32_t
  domain: language
  std_since: C++11
  summary: A distinct type for one UTF-32 code unit, i.e. one code point.
  intent: Type-safe UTF-32 text, where one unit is one Unicode code point.
  tags: [types, text, unicode]
  keys:
    canonical: language.type.utf32-code-unit
    colloquial: [utf32-character-type, one-unicode-code-point]
    symbolic: [char32_t]

- uid: cpp:lang.kw.class
  kind: keyword
  name: class
  domain: language
  std_since: C++98
  summary: Define a class type whose members default to private.
  intent: >-
    Bundle data with the operations that maintain its invariants. Identical to
    struct except for the default access level and default inheritance.
  tags: [types, oop, encapsulation]
  keys:
    canonical: language.type.define-class
    colloquial: [make-a-new-type, define-an-object-type, bundle-data-and-behaviour]
    question: [how-do-i.define-a-class]
    symbolic: [class]

- uid: cpp:lang.kw.concept
  kind: keyword
  name: concept
  domain: language
  std_since: C++20
  summary: Name a compile-time predicate constraining template arguments.
  intent: >-
    Say what a template requires of its type argument, so misuse produces a
    short readable error instead of pages of instantiation noise, and so
    overloads can be selected on capability.
  tags: [templates, constraints, generics]
  keys:
    canonical: language.template.define-concept
    colloquial: [constrain-a-template, say-what-a-type-must-support,
                 make-template-errors-readable]
    question: [how-do-i.constrain-a-template-parameter]
    problem: [my-template-error-messages-are-unreadable]
    symbolic: [concept]

- uid: cpp:lang.kw.const
  kind: keyword
  name: const
  domain: language
  std_since: C++98
  summary: Mark an object or member function as not modifying its target.
  intent: >-
    Promise not to change something, so the compiler enforces it and readers can
    rely on it. On a member function it means "does not modify *this".
  tags: [types, immutability, correctness]
  keys:
    canonical: language.type.immutable
    colloquial: [make-it-read-only, promise-not-to-modify-this, mark-a-method-const]
    question: [how-do-i.make-something-read-only]
    symbolic: [const]

- uid: cpp:lang.kw.consteval
  kind: keyword
  name: consteval
  domain: language
  std_since: C++20
  summary: Declare a function that may ONLY be called at compile time.
  intent: >-
    Stronger than constexpr: an immediate function. Every call must be a
    constant expression, so there is never a runtime version of it.
  tags: [compile-time, performance]
  keys:
    canonical: language.compile-time.immediate-function
    colloquial: [must-run-at-compile-time, never-allow-a-runtime-call]
    question: [how-do-i.force-compile-time-evaluation]
    symbolic: [consteval]

- uid: cpp:lang.kw.constexpr
  kind: keyword
  name: constexpr
  domain: language
  std_since: C++11
  summary: Allow a value or function to be evaluated at compile time.
  intent: >-
    Move work from run time to build time. A constexpr variable is a true
    compile-time constant usable as an array bound or template argument; a
    constexpr function may still be called at run time when its arguments are
    not constant.
  tags: [compile-time, performance]
  keys:
    canonical: language.compile-time.constant-expression
    colloquial: [compute-this-at-compile-time, bake-the-value-in,
                 make-it-a-compile-time-constant]
    question: [how-do-i.compute-something-at-compile-time]
    problem: [this-constant-is-recomputed-every-run]
    symbolic: [constexpr]

- uid: cpp:lang.kw.constinit
  kind: keyword
  name: constinit
  domain: language
  std_since: C++20
  summary: Require a static variable to be initialised at compile time.
  intent: >-
    Guarantee no dynamic initialisation, eliminating the static initialisation
    order fiasco, while still allowing later mutation (unlike constexpr).
  tags: [compile-time, initialisation, globals]
  keys:
    canonical: language.compile-time.static-initialisation
    colloquial: [no-dynamic-initialisation, avoid-static-init-order-fiasco]
    problem: [static-initialisation-order-fiasco]
    symbolic: [constinit]

- uid: cpp:lang.kw.const_cast
  kind: keyword
  name: const_cast
  domain: language
  std_since: C++98
  summary: Add or remove const/volatile from a pointer or reference.
  intent: >-
    Strip constness, almost always to call a legacy C API that takes a
    non-const pointer it does not actually modify. Writing through a
    const_cast to an originally-const object is undefined behaviour.
  tags: [casts, legacy-interop, danger]
  keys:
    canonical: language.cast.remove-const
    colloquial: [cast-away-const, strip-constness-for-a-c-api]
    question: [how-do-i.remove-const-from-a-pointer]
    problem: [this-c-api-wants-a-non-const-pointer]
    symbolic: [const_cast]

- uid: cpp:lang.kw.continue
  kind: keyword
  name: continue
  domain: language
  std_since: C++98
  summary: Skip the rest of this loop iteration and start the next one.
  intent: Skip elements that fail a filter without nesting the body in an if.
  tags: [control-flow, loops]
  keys:
    canonical: language.control.next-iteration
    colloquial: [skip-this-item-and-carry-on, jump-to-the-next-iteration]
    question: [how-do-i.skip-one-loop-iteration]
    symbolic: [continue]

- uid: cpp:lang.kw.co_await
  kind: keyword
  name: co_await
  domain: language
  std_since: C++20
  summary: Suspend a coroutine until an awaited operation completes.
  intent: >-
    Write asynchronous code in straight-line form. The function pauses, the
    thread is released to do other work, and execution resumes where it left
    off when the awaited thing is ready.
  tags: [async, coroutines, concurrency]
  keys:
    canonical: language.async.await
    colloquial: [wait-without-blocking-a-thread, pause-until-the-async-work-is-done,
                 write-async-code-that-reads-like-sync-code]
    question: [how-do-i.await-an-async-operation]
    problem: [my-callback-code-is-deeply-nested]
    symbolic: [co_await]

- uid: cpp:lang.kw.co_return
  kind: keyword
  name: co_return
  domain: language
  std_since: C++20
  summary: Finish a coroutine, optionally yielding a final value.
  intent: End a coroutine and deliver its result to whoever awaits it.
  tags: [async, coroutines]
  keys:
    canonical: language.async.coroutine-return
    colloquial: [finish-a-coroutine, return-from-async-code]
    symbolic: [co_return]

- uid: cpp:lang.kw.co_yield
  kind: keyword
  name: co_yield
  domain: language
  std_since: C++20
  summary: Produce one value from a coroutine and suspend until the next is wanted.
  intent: >-
    Write a lazy generator: emit items one at a time without materialising the
    whole sequence in memory.
  tags: [async, coroutines, generators, lazy]
  keys:
    canonical: language.async.yield-value
    colloquial: [produce-values-lazily, write-a-generator, emit-one-item-at-a-time]
    question: [how-do-i.write-a-lazy-generator]
    problem: [i-dont-want-to-build-the-whole-list-in-memory]
    symbolic: [co_yield]

- uid: cpp:lang.kw.decltype
  kind: keyword
  name: decltype
  domain: language
  std_since: C++11
  summary: Yield the declared type of an expression, without evaluating it.
  intent: >-
    Name a type you cannot spell -- the result of an expression, a lambda's
    type, or a dependent type in a template. decltype(auto) preserves
    references and value category exactly.
  tags: [types, deduction, templates]
  keys:
    canonical: language.type.of-expression
    colloquial: [get-the-type-of-an-expression, name-an-unspellable-type]
    question: [how-do-i.get-the-type-of-an-expression]
    symbolic: [decltype, "decltype(auto)"]

- uid: cpp:lang.kw.default
  kind: keyword
  name: default
  domain: language
  std_since: C++98
  summary: Label the fallback branch of a switch, or ask for a compiler-generated member.
  intent: >-
    Two unrelated uses -- the catch-all switch label, and "= default" asking the
    compiler to generate the obvious constructor, destructor, or assignment.
  tags: [control-flow, special-members]
  keys:
    canonical: language.control.switch-fallback
    colloquial: [the-other-cases-of-a-switch, ask-for-the-compiler-generated-version,
                 default-the-copy-constructor]
    question: [how-do-i.get-a-compiler-generated-constructor]
    symbolic: [default, "= default"]

- uid: cpp:lang.kw.delete
  kind: keyword
  name: delete
  domain: language
  std_since: C++98
  summary: Destroy a new-allocated object, or forbid an overload entirely.
  intent: >-
    Free memory obtained with new (prefer smart pointers), or "= delete" to make
    a function unusable so a bad call fails to compile.
  tags: [memory, special-members]
  keys:
    canonical: language.memory.free-object
    colloquial: [free-memory-from-new, forbid-a-function-overload,
                 make-a-class-non-copyable]
    question: [how-do-i.prevent-copying-of-my-class]
    problem: [i-am-leaking-memory-from-new]
    symbolic: [delete, "= delete", "delete[]"]

- uid: cpp:lang.kw.do
  kind: keyword
  name: do
  domain: language
  std_since: C++98
  summary: Run a loop body once before testing the condition.
  intent: Loop where the body must execute at least one time.
  tags: [control-flow, loops]
  keys:
    canonical: language.control.do-while-loop
    colloquial: [loop-at-least-once, test-the-condition-after-the-body]
    question: [how-do-i.run-a-loop-body-at-least-once]
    symbolic: [do, do-while]

- uid: cpp:lang.kw.double
  kind: keyword
  name: double
  domain: language
  std_since: C++98
  summary: Double-precision binary floating-point type.
  intent: The default choice for real numbers.
  tags: [types, fundamental, math]
  keys:
    canonical: language.type.double-precision-float
    colloquial: [a-decimal-number, floating-point-value]
    symbolic: [double]

- uid: cpp:lang.kw.dynamic_cast
  kind: keyword
  name: dynamic_cast
  domain: language
  std_since: C++98
  summary: Safely downcast a polymorphic reference or pointer, checking at run time.
  intent: >-
    Ask "is this base pointer really pointing at that derived type?". Returns
    nullptr for a failed pointer cast, throws std::bad_cast for a reference.
    Requires at least one virtual function.
  tags: [casts, polymorphism, rtti]
  keys:
    canonical: language.cast.checked-downcast
    colloquial: [safely-downcast-a-pointer, check-what-derived-type-this-really-is,
                 cast-a-base-pointer-to-a-derived-pointer]
    question: [how-do-i.downcast-safely]
    problem: [my-static-cast-downcast-is-crashing]
    symbolic: [dynamic_cast]

- uid: cpp:lang.kw.else
  kind: keyword
  name: else
  domain: language
  std_since: C++98
  summary: Provide the alternative branch of an if statement.
  intent: Do something different when the condition was false.
  tags: [control-flow, branching]
  keys:
    canonical: language.control.otherwise
    colloquial: [the-other-branch, what-to-do-when-the-test-fails]
    symbolic: [else]

- uid: cpp:lang.kw.enum
  kind: keyword
  name: enum
  domain: language
  std_since: C++98
  summary: Define a type whose values are a fixed named set.
  intent: >-
    Replace magic numbers with named alternatives. Prefer "enum class" (C++11),
    which is scoped and does not implicitly convert to int.
  tags: [types, constants]
  keys:
    canonical: language.type.define-enumeration
    colloquial: [name-a-fixed-set-of-values, replace-magic-numbers,
                 define-a-scoped-enum]
    question: [how-do-i.define-an-enum-class]
    problem: [my-code-is-full-of-magic-numbers]
    symbolic: [enum, enum class, enum struct]

- uid: cpp:lang.kw.explicit
  kind: keyword
  name: explicit
  domain: language
  std_since: C++98
  summary: Forbid a constructor or conversion operator from being used implicitly.
  intent: >-
    Stop surprising silent conversions. Since C++20, explicit(bool) makes it
    conditional on a compile-time test.
  tags: [conversions, correctness, constructors]
  keys:
    canonical: language.conversion.no-implicit
    colloquial: [stop-silent-conversions, require-a-deliberate-cast,
                 no-accidental-implicit-conversion]
    question: [how-do-i.prevent-implicit-conversion]
    problem: [my-constructor-is-being-called-accidentally]
    symbolic: [explicit]

- uid: cpp:lang.kw.export
  kind: keyword
  name: export
  domain: language
  std_since: C++20
  summary: Make a declaration visible to importers of a module.
  intent: Publish part of a module as its public interface.
  tags: [modules, visibility]
  keys:
    canonical: language.module.export-declaration
    colloquial: [make-something-public-from-a-module, publish-a-module-interface]
    symbolic: [export]

- uid: cpp:lang.kw.extern
  kind: keyword
  name: extern
  domain: language
  std_since: C++98
  summary: Declare that a name is defined in another translation unit, or set linkage.
  intent: >-
    Refer to a global defined elsewhere, or with extern "C" give a function
