- uid: cpp:lang.kw.alt_tokens
  kind: keyword
  name: and
  domain: language
  std_since: C++98
  summary: Alternative spellings for logical and bitwise operators.
  intent: >-
    and, or, not, not_eq, bitand, bitor, xor, compl, and_eq, or_eq, xor_eq are
    exact synonyms for &&, ||, !, !=, &, |, ^, ~, &=, |=, ^=. They exist for
    keyboards lacking those symbols and are rarely used in practice.
  tags: [operators, legacy, spelling]
  keys:
    canonical: language.operator.alternative-spellings
    colloquial: [word-versions-of-operators, spell-and-instead-of-double-ampersand]
    symbolic: [and, or, not, not_eq, bitand, bitor, xor, compl, and_eq, or_eq, xor_eq]
