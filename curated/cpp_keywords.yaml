# --- contextual keywords -----------------------------------------------------

- uid: cpp:lang.kw.final
  kind: keyword
  name: final
  domain: language
  std_since: C++11
  summary: Forbid further overriding of a virtual function, or further derivation from a class.
  intent: Close the hierarchy here, which also lets the compiler devirtualise calls.
  tags: [oop, inheritance, performance]
  keys:
    canonical: language.oop.forbid-override
    colloquial: [stop-anyone-subclassing-this, no-more-overriding,
                 help-the-compiler-devirtualise]
    symbolic: [final]

- uid: cpp:lang.kw.override
  kind: keyword
  name: override
  domain: language
  std_since: C++11
  summary: Assert that this function overrides a virtual from a base class.
  intent: >-
    Cheap insurance: if the signature does not actually match a base virtual,
    the compiler rejects it instead of silently creating a new function.
  tags: [oop, inheritance, correctness]
  keys:
    canonical: language.oop.assert-override
    colloquial: [check-that-i-really-am-overriding, catch-a-typo-in-a-virtual-signature]
    problem: [my-override-is-never-called]
    symbolic: [override]

- uid: cpp:lang.kw.module
  kind: keyword
  name: module
  domain: language
  std_since: C++20
  summary: Declare a module, replacing textual header inclusion.
  intent: >-
    Compile an interface once and import it, instead of re-parsing headers in
    every translation unit. Macros do not leak across a module boundary.
  tags: [modules, build, organisation]
  keys:
    canonical: language.module.declare
    colloquial: [replace-headers-with-modules, speed-up-my-build,
                 stop-macros-leaking-between-files]
    question: [how-do-i.use-c-plus-plus-modules]
    problem: [my-builds-are-slow-because-of-header-parsing]
    symbolic: [module]

- uid: cpp:lang.kw.import
  kind: keyword
  name: import
  domain: language
  std_since: C++20
  summary: Bring a module's exported names into this translation unit.
  intent: The module replacement for #include.
  tags: [modules, build]
  keys:
    canonical: language.module.import
    colloquial: [use-a-module, module-version-of-include]
    symbolic: [import]

