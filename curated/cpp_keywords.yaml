- uid: cpp:lang.kw.friend
  kind: keyword
  name: friend
  domain: language
  std_since: C++98
  summary: Grant another function or class access to private members.
  intent: >-
    Let a closely related non-member -- typically operator<< or a factory --
    see internals without making them public to everyone.
  tags: [access-control, oop]
  keys:
    canonical: language.access.grant-friendship
    colloquial: [let-another-class-see-my-privates,
                 give-a-free-function-access-to-private-members]
    question: [how-do-i.write-an-output-operator-that-sees-private-data]
    symbolic: [friend]

- uid: cpp:lang.kw.goto
  kind: keyword
  name: goto
  domain: language
  std_since: C++98
  summary: Jump unconditionally to a label in the same function.
  intent: >-
    Rarely justified in C++; RAII and break/continue cover almost every case.
    Occasionally used to escape deeply nested loops.
  tags: [control-flow, discouraged]
  keys:
    canonical: language.control.unconditional-jump
    colloquial: [jump-to-a-label, break-out-of-nested-loops]
    symbolic: [goto]

- uid: cpp:lang.kw.if
  kind: keyword
  name: if
  domain: language
  std_since: C++98
  summary: Execute a branch only when a condition holds.
  intent: >-
    Basic branching. "if constexpr" (C++17) discards the untaken branch at
    compile time; "if consteval" (C++23) detects constant evaluation; both
    support an init-statement since C++17.
  tags: [control-flow, branching]
  keys:
    canonical: language.control.conditional
    colloquial: [do-something-only-when, branch-on-a-condition,
                 compile-time-branch]
    question: [how-do-i.branch-at-compile-time]
    symbolic: [if, if constexpr, if consteval]

- uid: cpp:lang.kw.inline
  kind: keyword
  name: inline
  domain: language
  std_since: C++98
  summary: Permit multiple identical definitions across translation units.
  intent: >-
    Primarily a linkage rule, not an optimisation hint: it is what lets a
    function or (C++17) a variable be defined in a header without a duplicate
    symbol error at link time.
  tags: [linkage, headers]
  keys:
    canonical: language.linkage.inline-definition
    colloquial: [define-a-function-in-a-header, avoid-duplicate-symbol-errors,
                 header-only-variable]
    question: [how-do-i.define-a-global-in-a-header]
    problem: [multiple-definition-error-at-link-time]
    symbolic: [inline]

- uid: cpp:lang.kw.int
  kind: keyword
  name: int
  domain: language
  std_since: C++98
  summary: The default signed integer type.
  intent: Whole numbers; at least 16 bits, in practice 32.
  tags: [types, fundamental]
  keys:
    canonical: language.type.integer
    colloquial: [a-whole-number, plain-integer]
    symbolic: [int]

- uid: cpp:lang.kw.long
  kind: keyword
  name: long
  domain: language
  std_since: C++98
  summary: A longer signed integer type; "long long" is at least 64 bits.
  intent: Wider whole numbers. Prefer the fixed-width types in <cstdint> for portability.
