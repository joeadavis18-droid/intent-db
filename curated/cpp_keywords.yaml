- uid: cpp:lang.kw.false
  kind: keyword
  name: 'false'
  domain: language
  std_since: C++98
  summary: The boolean literal for "no".
  intent: The false value of type bool.
  tags: [literals, fundamental]
  keys:
    canonical: language.literal.false
    colloquial: [the-false-value, boolean-no]
    symbolic: ['false']

- uid: cpp:lang.kw.float
  kind: keyword
  name: float
  domain: language
  std_since: C++98
  summary: Single-precision binary floating-point type.
  intent: Half the memory of double, roughly seven significant digits.
  tags: [types, fundamental, math]
  keys:
    canonical: language.type.single-precision-float
    colloquial: [a-small-decimal-number, 32-bit-float]
    symbolic: [float]

- uid: cpp:lang.kw.for
  kind: keyword
  name: for
  domain: language
  std_since: C++98
  summary: Loop with an initialiser, a condition, and a step; or iterate a range.
  intent: >-
    The workhorse loop. The range-for form (C++11) walks any container or range
