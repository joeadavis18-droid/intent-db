# C language constructs. Structural only; the words live in each pack.
#
# Deliberately NOT a copy of language/cpp.yaml. C's keyword set diverges: it
# has restrict, _Generic, _Atomic and variably-modified types that C++ lacks,
# and lacks class, template, namespace, references and everything built on
# them. A construct present in both is still listed here, because the C entry
# is a different declaration with its own standard version.
